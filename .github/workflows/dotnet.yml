name: .NET CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Contact

    steps:
    # 1. Checkout du code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Setup .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # 3. Infos debug (optionnel mais utile)
    - name: Display .NET info
      run: dotnet --info

    # 4. Restore
    - name: Restore dependencies
      run: dotnet restore Contact.sln

    # 5. Build
    - name: Build project
      run: dotnet build Contact.sln --no-restore --configuration Release

    # 6. Tests
    - name: Run tests
      run: dotnet test Contact.sln --no-build --configuration Release --verbosity normal

    # 7. Publish (préparation pour déploiement)
    - name: Publish app
      run: dotnet publish Contact.sln --configuration Release --output ./publish

    # 8. Upload artifact (important pour CD)
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-app
        path: Contact/publish
